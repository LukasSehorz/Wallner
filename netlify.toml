[build]
  base = "site"
  command = "npm run build"
  # Relativ zu base ("site"), nicht zum Repo-Root.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Der Router laeuft im Browser (src/router.tsx). Damit echte URLs wie
# /leistungen/trockenbau auch beim direkten Aufruf und beim Teilen des Links
# funktionieren, muss jeder Pfad dieselbe index.html bekommen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Gehashte Build-Assets sind unveraenderlich -> dauerhaft cachen.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
